name: Pubblica il client Windows
on:
  push:
    branches: [main]
    paths: ['update.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-shooter-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verifica firma, crea ZIP e pubblica
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node make-release.cjs
